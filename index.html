<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Navbar + 2 Columnas</title>
    <style>
        /* RESET BÁSICO */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            background: #111;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;

            /* Animación */
            animation: slideDown 0.6s ease;
        }

        .navbar nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
            position: relative;
        }

        /* Animación hover */
        .navbar nav a::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: #00e5ff;
            transition: width 0.3s;
        }

        .navbar nav a:hover::after {
            width: 100%;
        }

        /* ANIMACIÓN NAVBAR */
        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* CONTENEDOR 2 COLUMNAS */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 50px;
        }

        /* COLUMNAS */
        .col img {
            width: 100%;
            margin-top: 15px;
            border-radius: 10px;
        }

        .col h2 {
            margin-bottom: 10px;
        }

        /* SECCIÓN EXTRA */
        .extra {
            padding: 50px;
            background: #f4f4f4;
        }

        .extra img {
            width: 100%;
            margin-top: 20px;
            border-radius: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <h1>Mi Web</h1>
        <nav>
            <a href="#inicio">Inicio</a>
            <a href="#galeria">Galería</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <!-- CONTENIDO -->
    <main class="container" id="inicio">
        <section class="col">
            <h2>Columna Izquierda</h2>
            <p>
                Este es un ejemplo de una columna con texto e imagen.
                El navbar se queda fijo al hacer scroll.
            </p>
            <img src="https://picsum.photos/400/250?random=1" alt="Imagen 1">
        </section>

        <section class="col">
            <h2>Columna Derecha</h2>
            <p>
                Puedes usar este layout para blogs, landing pages o portfolios.
            </p>
            <img src="https://picsum.photos/400/250?random=2" alt="Imagen 2">
        </section>
    </main>

    <!-- MÁS CONTENIDO PARA SCROLL -->
    <section class="extra" id="galeria">
        <h2>Galería</h2>
        <img src="https://picsum.photos/600/300?random=3">
        <img src="https://picsum.photos/600/300?random=4">
    </section>

</body>

</html>
