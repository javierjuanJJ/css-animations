<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animaciones</title>
    <style>
        .pulser {
            width: 30px;
            height: 30px;
            background: blue;
            border-radius: 50%;
            position: relative;
            animation: move;
            animation-duration: 3s;
        }


        @keyframes move {
            from {
                transform: translateY(0px);
                /* 0% */
            }

            to {
                transform: translateY(200px);
                /* 100% */
            }
        }

        body {
            display: grid;
            place-content: center;
            min-height: 50vh;
        }
    </style>
</head>

<body>
    <div class="pulser">

    </div>
</body>

</html>
