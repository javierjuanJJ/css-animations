<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Nav con Scroll Animation</title>
    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }

        /* NAVBAR */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 30px 50px;
            background: #111;
            color: white;

            /* Scroll Animation */
            animation: shrinkNav linear;
            animation-timeline: scroll();
            animation-range: 0 300px;
        }

        .navbar nav a {
            color: white;
            margin-left: 20px;
            text-decoration: none;
        }

        /* ANIMACIÓN DEL NAV */
        @keyframes shrinkNav {
            from {
                padding: 30px 50px;
                background-color: #111;
            }

            to {
                padding: 10px 50px;
                background-color: rgba(17, 17, 17, 0.85);
                backdrop-filter: blur(8px);
            }
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: TranslateY(100px);
            }

            /* Inicia invisible y bajo */
             to {
                opacity: 1;
                transform: TranslateY(0);
            }

            /* Termina visible en posición normal */
            [53,
            54]
        }

        /* CONTENEDOR 2 COLUMNAS */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 60px;
        }

        /* COLUMNAS */
        .col img {
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;

            animation: reveal linear both;
            animation-range: view();

        }

        /* SECCIÓN EXTRA */
        .extra {
            padding: 80px;
            background: #f3f3f3;
        }

        .extra img {
            width: 100%;
            margin-top: 20px;
            border-radius: 12px;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- NAV -->
    <header class="navbar">
        <h1>Mi Web</h1>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Galería</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <!-- CONTENIDO -->
    <main class="container">
        <section class="col">
            <h2>Columna 1</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
            <img src="https://picsum.photos/400/250?random=1">
        </section>

        <section class="col">
            <h2>Columna 2</h2>
            <p>Scroll para ver la animación del navbar.</p>
            <img src="https://picsum.photos/400/250?random=2">
        </section>
    </main>

    <!-- CONTENIDO EXTRA PARA SCROLL -->
    <section class="extra">
        <h2>Más contenido</h2>
        <p>Esto sirve para activar el scroll.</p>
        <img src="https://picsum.photos/600/300?random=3">
    </section>

</body>

</html>
