<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animaciones</title>
    <style>

        img{
            width: 80px;


            animation:
             mover 2s alternate 2 steps(15);
        }

        img:hover{
            animation-play-state: paused;
            opacity: .7;
            filter: contrast(150%);
            cursor: progress;
        }

        @keyframes mover {
            from  {
                transform: translateX(0);
            }
            
            to {
                transform: translateX(200px);
            }
        }

        @keyframes agrandar {
            0%  {
                scale: 1;
            }

            25%  {
                scale: 1.4;
            }

            50%  {
                scale: 1.6;
            }

            75%  {
                scale: 1.8;
            }
            
            100% {
                scale: 2;
            }
        }
        
    </style>
</head>

<body>
    <img src="mario.png" alt="">
</body>

</html>
